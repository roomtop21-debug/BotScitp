<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BinBonApp</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/BotScitp/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FF6B00">
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #000;
            --surface: #121212;
            --text: #fff;
            --text2: #aaa;
            --accent: #FF6B00;
            --accent2: #FF8C1A;
            --red: #FF2D55;
            --green: #4CAF50;
            --border: #262626;
            --nav-h: 56px;
            --header-h: 48px;
            --safe: env(safe-area-inset-bottom, 0px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }
        .phone {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            height: 100dvh;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 120px rgba(255,107,0,0.3);
            border: 1px solid #1a1a1a;
        }
        @media(min-width:440px) {
            .phone { border-radius: 36px; height: 92vh; height: 92dvh; }
        }

        /* SPLASH */
        .splash {
            position: absolute; inset: 0; background: #000;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 999; transition: opacity 0.5s ease;
        }
        .splash.hidden { opacity: 0; pointer-events: none; }
        .splash-logo {
            font-size: 60px; font-weight: 900; letter-spacing: -2px;
            background: linear-gradient(135deg, #FF6B00, #FFB800);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: splashPulse 1.5s ease-in-out infinite;
        }
        @keyframes splashPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        .splash-loader {
            width: 50px; height: 50px; margin-top: 20px;
            border: 4px solid #1a1a1a; border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* AUTH */
        .auth-screen {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%; padding: 28px 22px;
            gap: 14px; background: var(--bg); position: relative;
        }
        .auth-screen.hidden { display: none !important; }
        .auth-logo {
            font-size: 46px; font-weight: 900; letter-spacing: -1.5px;
            background: linear-gradient(135deg, #FF6B00, #FFB800, #FF6B00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% 200%; animation: shimmer 3s ease infinite;
            margin-bottom: 6px;
        }
        @keyframes shimmer { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
        .auth-subtitle { color: #888; font-size: 14px; text-align: center; }
        .auth-input {
            width: 100%; background: #111; border: 1px solid #333;
            color: #fff; padding: 15px 16px; border-radius: 14px;
            font-size: 15px; outline: none; font-family: inherit;
            transition: all 0.25s;
        }
        .auth-input:focus { border-color: var(--accent); background: #1a1a1a; box-shadow: 0 0 20px rgba(255,107,0,0.1); }
        .auth-input::placeholder { color: #555; }
        .auth-btn {
            width: 100%; background: linear-gradient(135deg, #FF6B00, #FF8C1A);
            color: #fff; border: none; padding: 15px; border-radius: 14px;
            font-weight: 700; font-size: 15px; cursor: pointer; letter-spacing: 0.3px;
            transition: all 0.2s;
        }
        .auth-btn:active { transform: scale(0.97); }
        .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .auth-btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); font-weight: 600; }
        .auth-toggle { color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; margin-top: 4px; }
        .auth-error { color: var(--red); font-size: 12px; text-align: center; min-height: 16px; max-width: 100%; word-wrap: break-word; }
        .auth-success { color: var(--green); font-size: 13px; text-align: center; font-weight: 600; }
        .code-inputs { display: flex; gap: 10px; justify-content: center; margin: 8px 0; }
        .code-inputs input {
            width: 46px; height: 56px; background: #111; border: 2px solid #333;
            color: #fff; border-radius: 12px; text-align: center;
            font-size: 24px; font-weight: 700; outline: none; font-family: inherit;
            transition: all 0.2s;
        }
        .code-inputs input:focus { border-color: var(--accent); background: #1a1a1a; }

        /* MAIN */
        .main-content { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .main-content.hidden { display: none !important; }
        .header {
            height: var(--header-h); display: flex; align-items: center;
            justify-content: space-between; padding: 0 16px;
            border-bottom: 1px solid var(--border); flex-shrink: 0;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 20;
        }
        .logo {
            font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FF6B00, #FFB800);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .header-actions button {
            background: none; border: none; color: #fff; cursor: pointer;
            padding: 8px; transition: 0.15s; border-radius: 10px; position: relative;
        }
        .header-actions button:active { background: rgba(255,255,255,0.1); transform: scale(0.9); }
        .notif-badge {
            position: absolute; top: 4px; right: 4px; width: 10px; height: 10px;
            background: var(--red); border-radius: 50%; border: 2px solid #000;
            display: none;
        }
        .notif-badge.show { display: block; }

        /* STORIES */
        .stories-container {
            padding: 12px 0; border-bottom: 1px solid var(--border);
            background: var(--bg); flex-shrink: 0; overflow-x: auto;
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .stories-container::-webkit-scrollbar { display: none; }
        .stories-list { display: flex; gap: 14px; padding: 0 16px; }
        .story-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 5px; cursor: pointer; flex-shrink: 0; transition: 0.15s;
        }
        .story-item:active { transform: scale(0.92); }
        .story-ring {
            width: 68px; height: 68px; border-radius: 50%; padding: 2.5px;
            background: linear-gradient(45deg, #FF6B00, #FFB800, #FF2D55);
            display: flex; align-items: center; justify-content: center;
        }
        .story-ring.viewed { background: #333; }
        .story-ring.add-story { background: #222; border: 2px dashed #555; padding: 0; }
        .story-avatar {
            width: 62px; height: 62px; border-radius: 50%; background: #1a1a1a;
            border: 2px solid #000; display: flex; align-items: center;
            justify-content: center; overflow: hidden;
        }
        .story-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .story-avatar svg { width: 36px; height: 36px; }
        .story-username {
            font-size: 11px; color: #999; max-width: 68px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* STORY VIEWER */
        .story-viewer {
            position: fixed; inset: 0; background: #000; z-index: 200;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .story-viewer.open { opacity: 1; pointer-events: auto; }
        .story-viewer .story-content {
            width: 100%; height: 100%; display: flex; align-items: center;
            justify-content: center; position: relative;
        }
        .story-viewer .story-content img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .story-viewer .story-close {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(0,0,0,0.6); border: none; color: #fff;
            width: 40px; height: 40px; border-radius: 50%; font-size: 20px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .story-viewer .story-user-info {
            position: absolute; top: 20px; left: 20px; display: flex;
            align-items: center; gap: 8px; z-index: 10;
        }
        .story-viewer .story-user-info .story-user-avatar {
            width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: #222;
        }
        .story-viewer .story-user-info .story-user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .story-viewer .story-user-info .story-user-name {
            color: #fff; font-weight: 600; font-size: 14px; text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        /* FEED */
        .feed { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
        .feed::-webkit-scrollbar { display: none; }
        .post { border-bottom: 1px solid var(--border); background: #000; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .post-header { display: flex; align-items: center; padding: 10px 14px; gap: 10px; }
        .post-avatar {
            width: 36px; height: 36px; border-radius: 50%; background: #222;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; overflow: hidden; border: 1px solid #333; cursor: pointer;
            transition: transform 0.15s;
        }
        .post-avatar:hover { transform: scale(1.1); }
        .post-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .post-avatar svg { width: 20px; height: 20px; }
        .post-user { font-weight: 600; font-size: 13px; flex: 1; cursor: pointer; }
        .post-user:hover { color: var(--accent); }
        .post-time { font-size: 11px; color: #777; }
        .post-img {
            width: 100%; aspect-ratio: 1/1; background: #0a0a0a;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .post-img img { width: 100%; height: 100%; object-fit: cover; }
        .heart-anim {
            position: absolute; pointer-events: none; z-index: 5;
            animation: heartPop 1s ease-out forwards;
        }
        @keyframes heartPop {
            0% { opacity: 1; transform: translate(-50%,-50%) scale(0.3); }
            30% { opacity: 1; transform: translate(-50%,-50%) scale(1.4); }
            100% { opacity: 0; transform: translate(-50%,-50%) scale(2.2) translateY(-70px); }
        }
        .post-actions { display: flex; align-items: center; padding: 8px 14px; gap: 14px; }
        .post-actions button {
            background: none; border: none; cursor: pointer; padding: 6px;
            color: #fff; transition: 0.15s; display: flex; align-items: center;
            gap: 5px; border-radius: 8px;
        }
        .post-actions button:active { transform: scale(0.85); background: rgba(255,255,255,0.05); }
        .post-actions .count { font-size: 13px; font-weight: 500; color: #ccc; }
        .post-likes { padding: 0 14px 4px; font-weight: 600; font-size: 13px; }
        .post-caption { padding: 0 14px 6px; font-size: 13px; line-height: 1.5; }
        .post-caption b { font-weight: 600; }
        .post-views { padding: 0 14px 4px; font-size: 11px; color: #666; }
        .post-comments-link { padding: 0 14px 12px; font-size: 12px; color: #888; cursor: pointer; }

        /* TABS */
        .tab { display: none !important; }
        .tab.active { display: flex !important; flex-direction: column; flex: 1; overflow-y: auto; }
        .tab::-webkit-scrollbar { display: none; }

        /* ADD FORM */
        .add-form {
            padding: 14px; background: #0a0a0a; border-bottom: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
        }
        .add-form.hidden { display: none; }
        .add-form textarea {
            background: #111; border: 1px solid #333; color: #fff;
            padding: 10px 14px; border-radius: 12px; font-size: 14px;
            font-family: inherit; outline: none; resize: none; height: 55px;
            transition: 0.2s;
        }
        .add-form textarea:focus { border-color: var(--accent); }
        .photo-upload {
            width: 100%; aspect-ratio: 1/1; background: #111;
            border: 2px dashed #333; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; overflow: hidden; position: relative; transition: 0.2s;
        }
        .photo-upload:hover { border-color: var(--accent); }
        .photo-upload img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        .photo-upload .placeholder { color: #555; font-size: 14px; z-index: 1; pointer-events: none; text-align: center; padding: 20px; }
        .story-upload-area {
            width: 100%; aspect-ratio: 9/16; max-height: 70vh; background: #111;
            border: 2px dashed #333; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; overflow: hidden; position: relative; transition: 0.2s;
        }
        .story-upload-area:hover { border-color: var(--accent); }
        .story-upload-area img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        .story-upload-area .placeholder { color: #555; font-size: 14px; z-index: 1; pointer-events: none; text-align: center; padding: 20px; }

        .btn {
            background: linear-gradient(135deg, #FF6B00, #FF8C1A);
            color: #fff; border: none; padding: 13px; border-radius: 12px;
            font-weight: 700; font-size: 14px; cursor: pointer; text-align: center;
            letter-spacing: 0.3px; transition: all 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }

        /* PROFILE */
        .profile-scroll { flex: 1; overflow-y: auto; }
        .profile-scroll::-webkit-scrollbar { display: none; }
        .profile-header-panel {
            padding: 22px 16px; display: flex; align-items: center;
            gap: 22px; border-bottom: 1px solid var(--border);
        }
        .profile-avatar {
            width: 84px; height: 84px; border-radius: 50%; background: #1a1a1a;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; overflow: hidden; cursor: pointer; position: relative;
            border: 3px solid #222; transition: 0.2s;
        }
        .profile-avatar:hover { border-color: var(--accent); }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-avatar .overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.55);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.2s; font-size: 12px; font-weight: 600;
        }
        .profile-avatar:hover .overlay { opacity: 1; }
        .profile-stats-row { display: flex; gap: 26px; }
        .stat-item { text-align: center; cursor: pointer; }
        .stat-num { font-weight: 700; font-size: 18px; }
        .stat-lbl { font-size: 11px; color: #888; }
        .profile-bio-panel { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .profile-bio-panel .display-name { font-weight: 700; font-size: 15px; }
        .profile-bio-panel .username-display { color: #888; font-size: 13px; }
        .profile-bio-panel .bio-text { margin-top: 4px; font-size: 13px; color: #ccc; }
        .profile-btn {
            background: #1a1a1a; border: 1px solid #444; color: #fff;
            padding: 8px 20px; border-radius: 10px; font-size: 13px;
            font-weight: 600; cursor: pointer; margin-top: 8px; transition: 0.2s;
            display: inline-block; margin-right: 6px;
        }
        .profile-btn:active { background: #333; }
        .profile-btn.following { background: var(--accent); border-color: var(--accent); color: #000; }
        .profile-grid-posts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; padding: 2px; }
        .grid-post {
            aspect-ratio: 1/1; background: #111; overflow: hidden;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center;
            justify-content: center;
        }
        .grid-post img { width: 100%; height: 100%; object-fit: cover; }
        .grid-post:active { opacity: 0.7; }

        /* SEARCH */
        .search-box { padding: 12px 16px; flex-shrink: 0; }
        .search-box input {
            width: 100%; background: #111; border: 1px solid #333; color: #fff;
            padding: 12px 16px; border-radius: 14px; font-size: 14px; outline: none;
            transition: 0.2s;
        }
        .search-box input:focus { border-color: var(--accent); }
        .search-results { padding: 0 16px; flex: 1; overflow-y: auto; }
        .notif-list { padding: 8px 0; }
        .notif-item {
            padding: 12px 16px; display: flex; align-items: center; gap: 10px;
            cursor: pointer; transition: 0.15s; border-bottom: 1px solid #111;
        }
        .notif-item:active { background: #111; }
        .notif-item .notif-icon {
            width: 40px; height: 40px; border-radius: 50%; background: #222;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            overflow: hidden;
        }
        .notif-item .notif-icon img { width: 100%; height: 100%; object-fit: cover; }
        .notif-item .notif-text { font-size: 13px; flex: 1; line-height: 1.4; }
        .notif-item .notif-text b { color: #fff; }
        .notif-item .notif-time { font-size: 11px; color: #666; }

        /* BOTTOM NAV */
        .bottom-nav {
            height: var(--nav-h); padding-bottom: var(--safe);
            display: flex; align-items: center; justify-content: space-around;
            border-top: 1px solid var(--border); background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px); flex-shrink: 0; z-index: 20;
        }
        .nav-btn {
            background: none; border: none; color: #666; cursor: pointer;
            padding: 8px 12px; transition: 0.2s; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-btn:active { transform: scale(0.9); }
        .nav-btn .nav-icon { width: 24px; height: 24px; }
        .nav-btn .nav-label { font-size: 10px; font-weight: 500; }

        /* TOAST */
        .toast {
            position: absolute; bottom: 80px; left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: #2a2a2a; color: #fff; padding: 12px 24px;
            border-radius: 30px; font-size: 13px; font-weight: 600;
            pointer-events: none; opacity: 0;
            transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 100; white-space: nowrap; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* MODAL */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 50; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal {
            background: #1a1a1a; border-radius: 20px; padding: 22px;
            width: 88%; max-width: 360px; border: 1px solid #333;
            max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .modal h3 { margin-bottom: 14px; font-size: 17px; text-align: center; font-weight: 700; }
        .modal input, .modal textarea {
            width: 100%; background: #111; border: 1px solid #333; color: #fff;
            padding: 12px 14px; border-radius: 12px; font-size: 14px;
            outline: none; margin-bottom: 10px; font-family: inherit; transition: 0.2s;
        }
        .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
        .cmt-input-row { display: flex; gap: 8px; margin: 10px 0; }
        .cmt-input-row input {
            flex: 1; background: #111; border: 1px solid #333; color: #fff;
            padding: 10px 14px; border-radius: 20px; font-size: 13px; outline: none; margin-bottom: 0;
        }
        .cmt-input-row button {
            background: var(--accent); border: none; color: #fff;
            padding: 10px 18px; border-radius: 20px; font-weight: 700;
            font-size: 13px; cursor: pointer; transition: 0.2s;
        }
        .cmt-input-row button:active { transform: scale(0.95); }
        .cmt-list { max-height: 220px; overflow-y: auto; text-align: left; font-size: 13px; margin: 10px 0; }
        .cmt-list .cmt-row { padding: 6px 0; border-bottom: 1px solid #1a1a1a; }
        .cmt-list .cmt-row b { color: #fff; }
        .cmt-list .cmt-time { font-size: 10px; color: #555; margin-left: 6px; }
        .loading-spinner {
            width: 30px; height: 30px; border: 3px solid #1a1a1a;
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.7s linear infinite; margin: 30px auto;
        }
        .empty-state {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%; color: #666;
            gap: 10px; padding: 40px; text-align: center;
        }
        .followers-modal-list { max-height: 300px; overflow-y: auto; }
        .follower-row {
            display: flex; align-items: center; gap: 10px; padding: 10px 0;
            border-bottom: 1px solid #1a1a1a; cursor: pointer;
        }
        .follower-row .flw-avatar {
            width: 40px; height: 40px; border-radius: 50%; overflow: hidden;
            background: #222; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .follower-row .flw-avatar img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <!-- SPLASH -->
    <div class="splash" id="splashScreen">
        <div class="splash-logo">BinBonApp</div>

    <script>
        // ============ FIREBASE INIT ============
        firebase.initializeApp({
            apiKey: "AIzaSyAvH0fUwbexhaAEww9HboKd2oyZaMalZSA",
            authDomain: "binbonapp.firebaseapp.com",
            databaseURL: "https://binbonapp-default-rtdb.firebaseio.com",
            projectId: "binbonapp",
            storageBucket: "binbonapp.firebasestorage.app",
            messagingSenderId: "317579462681",
            appId: "1:317579462681:web:8802b711ed45157f9a8288"
        });
        const auth = firebase.auth();
        const db = firebase.database();

        // ============ DOM HELPERS ============
        const $ = s => document.querySelector(s);
        const $$ = s => document.querySelectorAll(s);

        // ============ GLOBAL STATE ============
        let currentUser = null;
        let currentUserData = null;
        let allPosts = [];
        let allUsers = {};
        let allStories = [];
        let notifications = [];
        let currentTab = 'tab-feed';
        let selectedPhotoFile = null;
        let selectedStoryFile = null;
        let isLoginMode = true;
        let verificationCode = null;
        let splashHidden = false;
        let viewedStories = JSON.parse(localStorage.getItem('bba_viewedStories') || '{}');

        // ============ UTILS ============
        function toast(msg) { 
            clearTimeout(window._tt); 
            const t = $('#toast'); 
            t.textContent = msg; 
            t.classList.add('show'); 
            window._tt = setTimeout(() => t.classList.remove('show'), 2200); 
        }
        
        function openModal(html) { 
            $('#modalContent').innerHTML = html; 
            const overlay = $('#modalOverlay'); 
            overlay.classList.add('open'); 
            overlay.onclick = e => { if (e.target === overlay) closeModal(); }; 
        }
        
        function closeModal() { 
            $('#modalOverlay').classList.remove('open'); 
        }
        
        function pickFile() { 
            return new Promise(r => { 
                const inp = document.createElement('input'); 
                inp.type = 'file'; 
                inp.accept = 'image/*'; 
                inp.onchange = e => r(e.target.files[0] || null); 
                inp.click(); 
            }); 
        }
        
        function fileToDataURL(file) { 
            return new Promise(r => { 
                const reader = new FileReader(); 
                reader.onload = e => r(e.target.result); 
                reader.readAsDataURL(file); 
            }); 
        }
        
        function hashCode(s) { 
            let h = 0; 
            for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i); 
            return h; 
        }
        
        function timeAgo(iso) { 
            if (!iso) return ''; 
            const diff = Math.floor((Date.now() - new Date(iso)) / 1000); 
            if (diff < 30) return 'сейчас'; 
            if (diff < 60) return diff + 'с'; 
            if (diff < 3600) return Math.floor(diff / 60) + 'м'; 
            if (diff < 86400) return Math.floor(diff / 3600) + 'ч'; 
            return new Date(iso).toLocaleDateString('ru', { day: 'numeric', month: 'short' }); 
        }

        function userAvatar(data) {
            if (data?.photoURL && data.photoURL.startsWith('data:')) return `<img src="${data.photoURL}" alt="">`;
            if (data?.photoURL && data.photoURL.startsWith('http')) return `<img src="${data.photoURL}" alt="">`;
            const colors = ['#FF6B00','#FF2D55','#FFB800','#4ecdc4','#9b59b6'];
            const name = data?.name || data?.username || 'U';
            const c = colors[Math.abs(hashCode(name)) % colors.length];
            return `<svg viewBox="0 0 60 60"><circle cx="30" cy="22" r="14" fill="${c}"/><ellipse cx="30" cy="58" rx="20" ry="14" fill="${c}" opacity="0.7"/></svg>`;
        }

        function hideSplash() { 
            if (!splashHidden) { 
                $('#splashScreen').classList.add('hidden'); 
                setTimeout(() => {
                    const splash = $('#splashScreen');
                    if (splash) splash.remove();
                }, 600); 
                splashHidden = true; 
            } 
        }

        // ============ AUTH ============
        function updateAuthUI() {
            $('#authUsername').style.display = isLoginMode ? 'none' : 'block';
            $('#authName').style.display = isLoginMode ? 'none' : 'block';
            $('#authBtn').textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
            $('#authSubtitle').textContent = isLoginMode ? 'Войдите в аккаунт' : 'Создайте аккаунт';
            $('#authToggle').textContent = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
        }

        function setupCodeInputs() {
            const inputs = $$('#codeInputs input');
            inputs.forEach((inp, i) => {
                inp.addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 1);
                    if (this.value && i < 5) inputs[i + 1].focus();
                });
                inp.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && !this.value && i > 0) inputs[i - 1].focus();
                });
                inp.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pasted = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, 6);
                    pasted.split('').forEach((ch, idx) => { if (inputs[idx]) inputs[idx].value = ch; });
                    if (inputs[Math.min(pasted.length, 5)]) inputs[Math.min(pasted.length, 5)].focus();
                });
            });
        }

        function getCodeValue() { 
            let c = ''; 
            $$('#codeInputs input').forEach(i => c += i.value); 
            return c; 
        }

        // ============ LOAD DATA ============
        async function loadUsers() { 
            const snap = await db.ref('users').once('value'); 
            allUsers = snap.exists() ? snap.val() : {}; 
        }
        
        async function loadPosts() { 
            const snap = await db.ref('posts').once('value'); 
            allPosts = []; 
            if (snap.exists()) { 
                const data = snap.val(); 
                allPosts = Object.entries(data)
                    .map(([id, p]) => ({ id, ...p }))
                    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0)); 
            } 
        }
        
        async function loadNotifications() { 
            if (!currentUser) return; 
            const snap = await db.ref('notifications/' + currentUser.uid).once('value'); 
            notifications = []; 
            if (snap.exists()) { 
                const data = snap.val(); 
                notifications = Object.entries(data)
                    .map(([id, n]) => ({ id, ...n }))
                    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0)); 
            } 
            updateNotifBadge(); 
        }
        
        function updateNotifBadge() { 
            const unread = notifications.filter(n => !n.read).length; 
            const badge = $('#notifBadge'); 
            if (badge) {
                if (unread > 0) { 
                    badge.classList.add('show'); 
                    badge.textContent = unread; 
                } else { 
                    badge.classList.remove('show'); 
                } 
            }
        }

        // ============ STORIES ============
        async function loadStories() {
            if (!currentUser) return;
            const followingSnap = await db.ref('following/' + currentUser.uid).once('value');
            const followingIds = followingSnap.exists() ? Object.keys(followingSnap.val()) : [];
            if (!followingIds.includes(currentUser.uid)) followingIds.push(currentUser.uid);
            
            allStories = [];
            for (const uid of followingIds) {
                const snap = await db.ref('stories/' + uid).once('value');
                if (snap.exists()) {
                    const data = snap.val();
                    for (const [storyId, story] of Object.entries(data)) {
                        if (Date.now() - new Date(story.createdAt).getTime() < 86400000) {
                            allStories.push({ id: storyId, userId: uid, ...story });
                        }
                    }
                }
            }
            allStories.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            renderStories();
        }

        function renderStories() {
            const container = $('#storiesList');
            if (!container) return;
            
            const userStoriesMap = {};
            allStories.forEach(s => {
                if (!userStoriesMap[s.userId]) userStoriesMap[s.userId] = [];
                userStoriesMap[s.userId].push(s);
            });

            let html = `
                <div class="story-item" id="myStoryAdd">
                    <div class="story-ring add-story">
                        <div class="story-avatar">${userAvatar(currentUserData)}</div>
                    </div>
                    <span class="story-username">Моя</span>
                </div>`;

            for (const [uid, stories] of Object.entries(userStoriesMap)) {
                if (uid === currentUser?.uid) continue;
                const userData = allUsers[uid] || {};
                const hasUnviewed = stories.some(s => !viewedStories[s.id]);
                html += `
                    <div class="story-item" data-user-id="${uid}">
                        <div class="story-ring ${!hasUnviewed ? 'viewed' : ''}">
                            <div class="story-avatar">${userAvatar(userData)}</div>
                        </div>
                        <span class="story-username">${userData.username || 'user'}</span>
                    </div>`;
            }
            container.innerHTML = html;

            const myBtn = $('#myStoryAdd');
            if (myBtn) myBtn.onclick = () => {
                const form = $('#storyForm');
                if (form) form.classList.toggle('hidden');
                const addForm = $('#addForm');
                if (addForm) addForm.classList.add('hidden');
            };

            $$('.story-item[data-user-id]').forEach(el => {
                el.onclick = () => showStory(el.dataset.userId);
            });
        }

        function showStory(userId) {
            const userStories = allStories.filter(s => s.userId === userId);
            if (!userStories.length) return;
            const story = userStories[0];
            viewedStories[story.id] = true;
            localStorage.setItem('bba_viewedStories', JSON.stringify(viewedStories));
            renderStories();

            const userData = allUsers[userId] || {};
            const infoEl = $('#storyUserInfo');
            if (infoEl) infoEl.innerHTML = `
                <div class="story-user-avatar">${userAvatar(userData)}</div>
                <span class="story-user-name">${userData.username || 'user'}</span>`;
            
            const contentEl = $('#storyContent');
            if (contentEl) contentEl.innerHTML = `<img src="${story.imageURL}">`;
            
            const viewer = $('#storyViewer');
            if (viewer) viewer.classList.add('open');

            setTimeout(() => {
                if (viewer) viewer.classList.remove('open');
                loadStories();
            }, 5000);
        }

        // ============ MAIN APP ============
        function switchToMainApp() {
            console.log('🔄 Переключаем на главный экран');
            const authScreen = $('#authScreen');
            const mainContent = $('#mainContent');
            
            if (authScreen) authScreen.style.display = 'none';
            if (mainContent) {
                mainContent.style.display = 'flex';
                mainContent.classList.remove('hidden');
            }
            
            // Загружаем данные
            loadPosts().then(() => renderFeed());
            updateProfileTab();
            loadNotifications();
            loadStories();
            hideSplash();
        }

        function switchToAuth() {
            console.log('🔄 Переключаем на экран авторизации');
            const authScreen = $('#authScreen');
            const mainContent = $('#mainContent');
            const step1 = $('#authStep1');
            const step2 = $('#authStep2');
            
            if (mainContent) {
                mainContent.style.display = 'none';
                mainContent.classList.add('hidden');
            }
            if (authScreen) {
                authScreen.style.display = 'flex';
                authScreen.classList.remove('hidden');
            }
            if (step1) step1.style.display = 'flex';
            if (step2) step2.style.display = 'none';
            
            allPosts = [];
            hideSplash();
        }

        function init() {
            console.log('🚀 BinBonApp инициализация...');
            
            // Splash показываем сразу
            const splash = $('#splashScreen');
            if (splash) splash.style.display = 'flex';
            
            // Auth screen скрываем
            const authScreen = $('#authScreen');
            if (authScreen) authScreen.style.display = 'none';
            
            // Main content скрываем
            const mainContent = $('#mainContent');
            if (mainContent) mainContent.style.display = 'none';
            
            // Настраиваем интерфейс авторизации
            updateAuthUI();
            setupCodeInputs();
            
            // Кнопка переключения режима
            const authToggle = $('#authToggle');
            if (authToggle) authToggle.onclick = () => {
                isLoginMode = !isLoginMode;
                updateAuthUI();
                const err = $('#authError');
                if (err) err.textContent = '';
            };
            
            // Кнопка назад
            const backBtn = $('#backToStep1');
            if (backBtn) backBtn.onclick = () => {
                const step1 = $('#authStep1');
                const step2 = $('#authStep2');
                if (step1) step1.style.display = 'flex';
                if (step2) step2.style.display = 'none';
            };
            
            // Кнопка входа/регистрации
            const authBtn = $('#authBtn');
            if (authBtn) authBtn.onclick = async () => {
                const email = $('#authEmail')?.value?.trim() || '';
                const pass = $('#authPassword')?.value?.trim() || '';
                const uname = $('#authUsername')?.value?.trim().toLowerCase() || '';
                const name = $('#authName')?.value?.trim() || '';
                const err = $('#authError');
                
                if (err) err.textContent = '';
                
                if (!email || !pass) {
                    if (err) err.textContent = 'Заполните все поля';
                    return;
                }
                if (pass.length < 6) {
                    if (err) err.textContent = 'Пароль минимум 6 символов';
                    return;
                }
                if (!isLoginMode) {
                    if (!uname || !name) {
                        if (err) err.textContent = 'Заполните юзернейм и имя';
                        return;
                    }
                    if (!/^[a-zA-Z0-9_]+$/.test(uname)) {
                        if (err) err.textContent = 'Юзернейм: только буквы, цифры и _';
                        return;
                    }
                    // Проверка юзернейма
                    const snap = await db.ref('users').orderByChild('username').equalTo(uname).once('value');
                    if (snap.exists()) {
                        if (err) err.textContent = 'Юзернейм уже занят';
                        return;
                    }
                }
                
                const loading = $('#authLoading');
                if (loading) loading.style.display = 'block';
                if (authBtn) authBtn.disabled = true;
                
                try {
                    if (isLoginMode) {
                        await auth.signInWithEmailAndPassword(email, pass);
                    } else {
                        const cred = await auth.createUserWithEmailAndPassword(email, pass);
                        await cred.user.updateProfile({ displayName: name });
                        await db.ref('users/' + cred.user.uid).set({
                            username: uname,
                            name,
                            email,
                            photoURL: null,
                            bio: '',
                            createdAt: new Date().toISOString()
                        });
                    }
                    
                    // Генерируем код подтверждения
                    verificationCode = Math.floor(100000 + Math.random() * 900000).toString();
                    const user = auth.currentUser;
                    if (user) {
                        await db.ref('verificationCodes/' + user.uid).set({
                            code: verificationCode,
                            createdAt: Date.now()
                        });
                    }
                    
                    const msg = $('#codeSentMsg');
                    if (msg) msg.textContent = 'Код подтверждения: ' + verificationCode;
                    
                    const step1 = $('#authStep1');
                    const step2 = $('#authStep2');
                    if (step1) step1.style.display = 'none';
                    if (step2) step2.style.display = 'block';
                    
                } catch (e) {
                    console.error('Auth error:', e);
                    let msg = e.message;
                    if (e.code === 'auth/email-already-in-use') msg = 'Email уже используется';
                    else if (e.code === 'auth/invalid-email') msg = 'Неверный email';
                    else if (e.code === 'auth/user-not-found') msg = 'Пользователь не найден';
                    else if (e.code === 'auth/wrong-password') msg = 'Неверный пароль';
                    if (err) err.textContent = msg;
                } finally {
                    if (loading) loading.style.display = 'none';
                    if (authBtn) authBtn.disabled = false;
                }
            };
            
            // Кнопка подтверждения кода
            const verifyBtn = $('#verifyCodeBtn');
            if (verifyBtn) verifyBtn.onclick = async () => {
                const code = getCodeValue();
                const err = $('#codeError');
                if (err) err.textContent = '';
                
                if (code.length !== 6) {
                    if (err) err.textContent = 'Введите 6 цифр';
                    return;
                }
                
                const user = auth.currentUser;
                if (!user) {
                    if (err) err.textContent = 'Пользователь не найден';
                    return;
                }
                
                try {
                    const snap = await db.ref('verificationCodes/' + user.uid).once('value');
                    if (!snap.exists()) {
                        if (err) err.textContent = 'Код не найден';
                        return;
                    }
                    
                    const data = snap.val();
                    if (data.code !== code) {
                        if (err) err.textContent = 'Неверный код';
                        return;
                    }
                    
                    // Удаляем код из базы
                    await db.ref('verificationCodes/' + user.uid).remove();
                    
                    // ПОКАЗЫВАЕМ ГЛАВНЫЙ ЭКРАН
                    console.log('✅ Код верный, переключаем на главный экран');
                    switchToMainApp();
                    
                } catch (e) {
                    console.error('Verification error:', e);
                    if (err) err.textContent = 'Ошибка: ' + e.message;
                }
            };
            
            // Кнопка повторной отправки кода
            const resendBtn = $('#resendCodeBtn');
            if (resendBtn) resendBtn.onclick = async () => {
                const user = auth.currentUser;
                if (!user) return;
                verificationCode = Math.floor(100000 + Math.random() * 900000).toString();
                await db.ref('verificationCodes/' + user.uid).set({
                    code: verificationCode,
                    createdAt: Date.now()
                });
                const msg = $('#codeSentMsg');
                if (msg) msg.textContent = 'Новый код: ' + verificationCode;
            };
            
            // Отслеживание авторизации
            auth.onAuthStateChanged(async (user) => {
                console.log('👤 Auth state changed:', user ? 'Вошёл' : 'Вышел');
                currentUser = user;
                
                if (user) {
                    await loadUsers();
                    currentUserData = allUsers[user.uid] || {};
                    
                    // Проверяем код подтверждения
                    const codeSnap = await db.ref('verificationCodes/' + user.uid).once('value');
                    
                    if (codeSnap.exists()) {
                        // Нужно подтверждение
                        console.log('📧 Требуется код подтверждения');
                        const authScreen = $('#authScreen');
                        const mainContent = $('#mainContent');
                        const step1 = $('#authStep1');
                        const step2 = $('#authStep2');
                        
                        if (authScreen) {
                            authScreen.style.display = 'flex';
                            authScreen.classList.remove('hidden');
                        }
                        if (mainContent) {
                            mainContent.style.display = 'none';
                            mainContent.classList.add('hidden');
                        }
                        if (step1) step1.style.display = 'none';
                        if (step2) step2.style.display = 'block';
                        
                        const msg = $('#codeSentMsg');
                        if (msg) msg.textContent = 'Введите код подтверждения';
                        
                    } else {
                        // Уже подтверждён
                        console.log('✅ Пользователь подтверждён');
                        switchToMainApp();
                    }
                } else {
                    switchToAuth();
                }
                
                hideSplash();
            });
            
            // Кнопка выхода
            const logoutBtn = $('#btnLogout');
            if (logoutBtn) logoutBtn.onclick = async () => {
                await auth.signOut();
                toast('До встречи!');
            };
            
            // Кнопка добавления поста
            const addPostBtn = $('#btnAddPost');
            if (addPostBtn) addPostBtn.onclick = () => {
                if (!currentUser) return toast('Войдите');
                const addForm = $('#addForm');
                const storyForm = $('#storyForm');
                if (addForm) addForm.classList.toggle('hidden');
                if (storyForm) storyForm.classList.add('hidden');
            };
            
            // Загрузка фото для поста
            const photoArea = $('#photoUploadArea');
            if (photoArea) photoArea.onclick = async () => {
                const file = await pickFile();
                if (!file) return;
                selectedPhotoFile = file;
                const url = await fileToDataURL(file);
                if (photoArea) photoArea.innerHTML = `<img src="${url}"><span class="placeholder">Изменить фото</span>`;
            };
            
            // Публикация поста
            const publishBtn = $('#btnPublish');
            if (publishBtn) publishBtn.onclick = async () => {
                if (!currentUser) return toast('Войдите');
                if (!selectedPhotoFile) return toast('Выберите фото');
                
                if (publishBtn) publishBtn.disabled = true;
                
                try {
                    const imageURL = await fileToDataURL(selectedPhotoFile);
                    const ref = db.ref('posts').push();
                    await ref.set({
                        userId: currentUser.uid,
                        username: currentUserData?.username || 'user',
                        userName: currentUserData?.name || 'User',
                        imageURL,
                        caption: $('#inputCaption')?.value?.trim() || '',
                        likes: {},
                        comments: {},
                        views: 0,
                        createdAt: new Date().toISOString()
                    });
                    
                    const captionInput = $('#inputCaption');
                    if (captionInput) captionInput.value = '';
                    selectedPhotoFile = null;
                    
                    if (photoArea) photoArea.innerHTML = '<span class="placeholder"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><br>Выбрать фото</span>';
                    
                    const addForm = $('#addForm');
                    if (addForm) addForm.classList.add('hidden');
                    
                    await loadPosts();
                    renderFeed();
                    updateProfileTab();
                    toast('Опубликовано!');
                } catch (e) {
                    toast('Ошибка');
                }
                
                if (publishBtn) publishBtn.disabled = false;
            };
            
            // Загрузка фото для истории
            const storyArea = $('#storyUploadArea');
            if (storyArea) storyArea.onclick = async () => {
                const file = await pickFile();
                if (!file) return;
                selectedStoryFile = file;
                const url = await fileToDataURL(file);
                if (storyArea) storyArea.innerHTML = `<img src="${url}"><span class="placeholder">Изменить фото</span>`;
            };
            
            // Публикация истории
            const publishStoryBtn = $('#btnPublishStory');
            if (publishStoryBtn) publishStoryBtn.onclick = async () => {
                if (!currentUser) return toast('Войдите');
                if (!selectedStoryFile) return toast('Выберите фото');
                
                if (publishStoryBtn) publishStoryBtn.disabled = true;
                
                try {
                    const imageURL = await fileToDataURL(selectedStoryFile);
                    const ref = db.ref('stories/' + currentUser.uid).push();
                    await ref.set({ imageURL, createdAt: new Date().toISOString() });
                    
                    selectedStoryFile = null;
                    if (storyArea) storyArea.innerHTML = '<span class="placeholder"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><br>Выбрать фото для истории</span>';
                    
                    const storyForm = $('#storyForm');
                    if (storyForm) storyForm.classList.add('hidden');
                    
                    await loadStories();
                    toast('История опубликована!');
                } catch (e) {
                    toast('Ошибка');
                }
                
                if (publishStoryBtn) publishStoryBtn.disabled = false;
            };
            
            // Закрытие истории
            const storyCloseBtn = $('#storyClose');
            if (storyCloseBtn) storyCloseBtn.onclick = () => {
                const viewer = $('#storyViewer');
                if (viewer) viewer.classList.remove('open');
            };
            
            // Уведомления
            const notifBtn = $('#btnNotifications');
            if (notifBtn) notifBtn.onclick = () => switchTab('tab-notifications');
            
            // Навигация
            $$('.nav-btn[data-tab]').forEach(b => {
                b.onclick = function() {
                    switchTab(this.dataset.tab);
                };
            });
            
            // Закрытие модалок по Escape
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    closeModal();
                    const viewer = $('#storyViewer');
                    if (viewer) viewer.classList.remove('open');
                }
            });
            
            // Поиск
            const searchInput = $('#searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', async function() {
                    const q = this.value.trim().toLowerCase();
                    const res = $('#searchResults');
                    if (!res) return;
                    
                    if (!q) {
                        res.innerHTML = '<div style="color:#666;text-align:center;padding:20px;">Введите юзернейм</div>';
                        return;
                    }
                    
                    const found = Object.entries(allUsers).filter(([uid, data]) => 
                        (data.username || '').toLowerCase().includes(q) && uid !== currentUser?.uid
                    );
                    
                    if (!found.length) {
                        res.innerHTML = '<div style="color:#666;text-align:center;padding:20px;">Ничего не найдено</div>';
                        return;
                    }
                    
                    res.innerHTML = found.map(([uid, data]) => `
                        <div class="follower-row search-user" data-uid="${uid}" style="cursor:pointer;">
                            <div class="flw-avatar">${userAvatar(data)}</div>
                            <div><b>@${data.username || 'user'}</b><br><span style="font-size:11px;color:#888;">${data.name || ''}</span></div>
                        </div>
                    `).join('');
                    
                    $$('.search-user').forEach(el => {
                        el.onclick = () => {
                            switchTab('tab-profile');
                            setTimeout(() => updateProfileTab(el.dataset.uid), 100);
                        };
                    });
                });
            }
            
            console.log('✅ BinBonApp инициализирован');
        }

        function switchTab(tabId) {
            $$('.tab').forEach(t => t.classList.remove('active'));
            const tab = document.getElementById(tabId);
            if (tab) tab.classList.add('active');
            
            $$('.nav-btn').forEach(b => b.classList.remove('active'));
            const nb = document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
            if (nb) nb.classList.add('active');
            
            const addForm = $('#addForm');
            const storyForm = $('#storyForm');
            if (addForm) addForm.classList.add('hidden');
            if (storyForm) storyForm.classList.add('hidden');
            
            currentTab = tabId;
            
            if (tabId === 'tab-profile') updateProfileTab();
            if (tabId === 'tab-notifications') {
                loadNotifications().then(() => renderNotifications());
            }
        }

        function renderFeed() {
            const feed = $('#feedContent');
            if (!feed) return;
            
            if (!allPosts.length) {
                feed.innerHTML = '<div class="empty-state"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Пока нет постов</span></div>';
                return;
            }
            
            feed.innerHTML = allPosts.map(p => {
                const likes = p.likes || {};
                const la = Object.values(likes);
                const liked = currentUser && la.includes(currentUser.uid);
                const comments = p.comments || {};
                const ca = Object.values(comments);
                const u = allUsers[p.userId] || {};
                
                return `<article class="post" data-id="${p.id}">
                    <div class="post-header">
                        <div class="post-avatar" data-user-id="${p.userId}">${userAvatar(u)}</div>
                        <span class="post-user" data-user-id="${p.userId}">${p.username || p.userName || 'user'}</span>
                        <span class="post-time">${timeAgo(p.createdAt)}</span>
                    </div>
                    <div class="post-img" data-id="${p.id}"><img src="${p.imageURL}" loading="lazy"></div>
                    <div class="post-actions">
                        <button class="like-btn" data-id="${p.id}">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="${liked ? '#FF2D55' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                            <span class="count">${la.length}</span>
                        </button>
                        <button class="cmt-btn" data-id="${p.id}">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            <span class="count">${ca.length}</span>
                        </button>
                        <button class="share-btn" data-id="${p.id}">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/></svg>
                        </button>
                    </div>
                    <div class="post-likes">${la.length} отметок "Нравится"</div>
                    ${p.caption ? `<div class="post-caption"><b>${p.username || 'user'}</b> ${p.caption}</div>` : ''}
                    <div class="post-views">${p.views || 0} просмотров</div>
                    <div class="post-comments-link" data-id="${p.id}">Смотреть комментарии (${ca.length})</div>
                </article>`;
            }).join('');
            
            // Обработчики
            $$('.like-btn').forEach(b => b.onclick = async () => {
                const postId = b.dataset.id;
                if (!currentUser) return toast('Войдите');
                const post = allPosts.find(p => p.id === postId);
                if (!post) return;
                
                const likes = post.likes || {};
                const arr = Object.values(likes);
                
                if (arr.includes(currentUser.uid)) {
                    const key = Object.entries(likes).find(([k, v]) => v === currentUser.uid)?.[0];
                    if (key) await db.ref('posts/' + postId + '/likes/' + key).remove();
                } else {
                    const ref = db.ref('posts/' + postId + '/likes').push();
                    await ref.set(currentUser.uid);
                }
                await loadPosts();
                renderFeed();
            });
            
            $$('.cmt-btn, .post-comments-link').forEach(b => b.onclick = () => {
                const postId = b.dataset.id;
                const post = allPosts.find(p => p.id === postId);
                if (!post) return;
                
                const comments = Object.values(post.comments || {}).sort((a, b) => 
                    new Date(a.createdAt || 0) - new Date(b.createdAt || 0)
                );
                
                openModal(`
                    <h3>Комментарии</h3>
                    <div class="cmt-list">${comments.length ? comments.map(c => 
                        `<div class="cmt-row"><b>${c.username || c.userName}</b><span class="cmt-time">${timeAgo(c.createdAt)}</span><br>${c.text}</div>`
                    ).join('') : '<div style="color:#666;text-align:center;padding:15px;">Пока нет</div>'}</div>
                    <div class="cmt-input-row">
                        <input id="cmtInput" placeholder="Комментарий..." maxlength="200">
                        <button id="sendCmt">Отпр.</button>
                    </div>
                    <button class="btn btn-outline" id="closeCmt" style="margin-top:8px;">Закрыть</button>
                `);
                
                $('#sendCmt').onclick = async () => {
                    const text = $('#cmtInput')?.value?.trim();
                    if (!text || !currentUser) return;
                    
                    const ref = db.ref('posts/' + postId + '/comments').push();
                    await ref.set({
                        userId: currentUser.uid,
                        username: currentUserData?.username || 'user',
                        userName: currentUserData?.name || 'User',
                        text,
                        createdAt: new Date().toISOString()
                    });
                    
                    closeModal();
                    await loadPosts();
                    renderFeed();
                };
                
                $('#closeCmt').onclick = closeModal;
            });
            
            $$('.share-btn').forEach(b => b.onclick = async () => {
                const post = allPosts.find(p => p.id === b.dataset.id);
                if (!post || !currentUser) return;
                
                const ref = db.ref('posts').push();
                await ref.set({
                    userId: currentUser.uid,
                    username: currentUserData?.username || 'user',
                    userName: currentUserData?.name || 'User',
                    imageURL: post.imageURL,
                    caption: 'Репост от @' + (post.username || 'user') + ': ' + (post.caption || ''),
                    likes: {},
                    comments: {},
                    views: 0,
                    createdAt: new Date().toISOString()
                });
                
                toast('Репост добавлен!');
                await loadPosts();
                renderFeed();
            });
            
            $$('.post-avatar, .post-user').forEach(el => {
                el.addEventListener('click', () => {
                    const uid = el.dataset.userId;
                    if (uid) {
                        switchTab('tab-profile');
                        setTimeout(() => updateProfileTab(uid), 100);
                    }
                });
            });
        }

        async function updateProfileTab(userId = null) {
            const tid = userId || currentUser?.uid;
            if (!tid) return;
            
            const ud = tid === currentUser?.uid ? currentUserData : (allUsers[tid] || {});
            const isMe = tid === currentUser?.uid;
            const myPosts = allPosts.filter(p => p.userId === tid);
            
            const fSnap = await db.ref('followers/' + tid).once('value');
            const fc = fSnap.exists() ? Object.keys(fSnap.val()).length : 0;
            
            const fwSnap = await db.ref('following/' + tid).once('value');
            const fwc = fwSnap.exists() ? Object.keys(fwSnap.val()).length : 0;
            
            const following = isMe ? false : await (async () => {
                if (!currentUser) return false;
                const s = await db.ref('following/' + currentUser.uid + '/' + tid).once('value');
                return s.exists();
            })();
            
            const scroll = $('#profileScroll');
            if (!scroll) return;
            
            scroll.innerHTML = `
                <div class="profile-header-panel">
                    <div class="profile-avatar" id="profileAvatarBig">${userAvatar(ud)}${isMe ? '<div class="overlay">Сменить</div>' : ''}</div>
                    <div class="profile-stats-row">
                        <div class="stat-item"><div class="stat-num">${myPosts.length}</div><div class="stat-lbl">Постов</div></div>
                        <div class="stat-item"><div class="stat-num">${fc}</div><div class="stat-lbl">Подписчиков</div></div>
                        <div class="stat-item"><div class="stat-num">${fwc}</div><div class="stat-lbl">Подписок</div></div>
                    </div>
                </div>
                <div class="profile-bio-panel">
                    <div class="display-name">${ud.name || 'Пользователь'}</div>
                    <div class="username-display">@${ud.username || 'username'}</div>
                    <div class="bio-text">${ud.bio || ''}</div>
                    ${isMe ? '<button class="profile-btn" id="editProfileBtn">Редактировать</button>' : 
                    `<button class="profile-btn ${following ? 'following' : ''}" id="followBtn">${following ? 'Подписаны' : 'Подписаться'}</button>`}
                </div>
                <div class="profile-grid-posts">${myPosts.length ? myPosts.map(p => `<div class="grid-post" data-id="${p.id}"><img src="${p.imageURL}"></div>`).join('') : '<div style="grid-column:1/-1;text-align:center;color:#666;padding:40px;">Нет постов</div>'}</div>
            `;
            
            if (isMe) {
                const avatarBig = $('#profileAvatarBig');
                if (avatarBig) avatarBig.onclick = async () => {
                    const file = await pickFile();
                    if (!file) return;
                    const dataURL = await fileToDataURL(file);
                    await currentUser.updateProfile({ photoURL: dataURL });
                    await db.ref('users/' + currentUser.uid).update({ photoURL: dataURL });
                    currentUserData.photoURL = dataURL;
                    currentUser.photoURL = dataURL;
                    await loadUsers();
                    updateProfileTab();
                    toast('Аватар обновлён!');
                };
                
                const editBtn = $('#editProfileBtn');
                if (editBtn) editBtn.onclick = () => {
                    if (!currentUser) return;
                    openModal(`
                        <h3>Редактировать профиль</h3>
                        <input id="editName" placeholder="Имя" value="${currentUserData?.name || ''}" maxlength="30">
                        <input id="editBio" placeholder="О себе" value="${currentUserData?.bio || ''}" maxlength="150">
                        <button class="btn" id="saveProfile">Сохранить</button>
                        <button class="btn btn-outline" id="cancelProfile" style="margin-top:6px;">Отмена</button>
                    `);
                    
                    $('#saveProfile').onclick = async () => {
                        const name = $('#editName')?.value?.trim() || '';
                        const bio = $('#editBio')?.value?.trim() || '';
                        if (!name) return toast('Имя обязательно');
                        await currentUser.updateProfile({ displayName: name });
                        await db.ref('users/' + currentUser.uid).update({ name, bio });
                        currentUserData.name = name;
                        currentUserData.bio = bio;
                        closeModal();
                        updateProfileTab();
                        toast('Сохранено!');
                    };
                    
                    $('#cancelProfile').onclick = closeModal;
                };
            } else {
                const followBtn = $('#followBtn');
                if (followBtn) followBtn.onclick = async () => {
                    if (following) {
                        await db.ref('followers/' + tid + '/' + currentUser.uid).remove();
                        await db.ref('following/' + currentUser.uid + '/' + tid).remove();
                    } else {
                        await db.ref('followers/' + tid + '/' + currentUser.uid).set(true);
                        await db.ref('following/' + currentUser.uid + '/' + tid).set(true);
                    }
                    await loadUsers();
                    updateProfileTab(tid);
                    toast(following ? 'Отписались' : 'Подписались');
                };
            }
            
            $$('.grid-post').forEach(el => el.onclick = () => {
                switchTab('tab-feed');
                setTimeout(() => {
                    const p = document.querySelector(`.post[data-id="${el.dataset.id}"]`);
                    if (p) p.scrollIntoView({ behavior: 'smooth' });
                }, 300);
            });
        }

        function renderNotifications() {
            const list = $('#notifList');
            if (!list) return;
            
            if (!notifications.length) {
                list.innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>Уведомлений пока нет</span></div>';
                return;
            }
            
            list.innerHTML = notifications.map(n => {
                const u = allUsers[n.fromUserId] || {};
                let t = '';
                switch (n.type) {
                    case 'follow': t = `<b>@${n.fromName}</b> подписался на вас`; break;
                    case 'like': t = `<b>@${n.fromName}</b> лайкнул вашу публикацию`; break;
                    case 'comment': t = `<b>@${n.fromName}</b> прокомментировал: "${(n.commentText || '').slice(0, 50)}..."`; break;
                }
                return `<div class="notif-item" data-post-id="${n.postId || ''}" data-type="${n.type}">
                    <div class="notif-icon">${userAvatar(u)}</div>
                    <div class="notif-text">${t}</div>
                    <div class="notif-time">${timeAgo(n.createdAt)}</div>
                </div>`;
            }).join('');
            
            $$('.notif-item').forEach(el => el.onclick = function() {
                if (this.dataset.postId) {
                    switchTab('tab-feed');
                    setTimeout(() => {
                        const p = document.querySelector(`.post[data-id="${this.dataset.postId}"]`);
                        if (p) p.scrollIntoView({ behavior: 'smooth' });
                    }, 300);
                } else if (this.dataset.type === 'follow') {
                    switchTab('tab-profile');
                }
            });
        }

        // ============ START ============
        init();
    </script>

    <!-- PWA Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/BotScitp/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
